name: ghcr_cicd

on:
  push:
    branches:
      - main

jobs:
  test-execution:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: check bash availability
        run: bash --version

      - name: execute script with default arg
        run: bash greetings.sh

      - name: execute script with custom arg
        run: bash greetings.sh anant

      - name: execute script with --help arg
        run: bash greetings.sh --help

  docker-build:
    needs: test-execution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: check docker tools versions
        run: |
          docker --version 
          docker compose version

      - name: build docker image
        run: docker build -t ghcr.io/ashu781/greet:sha-"${GITHUB_SHA::7}" .

      - name: ghcr login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: docker image push
        run: docker push ghcr.io/ashu781/greet:sha-"${GITHUB_SHA::7}"

